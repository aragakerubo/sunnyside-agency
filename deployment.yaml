apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  labels:
    app: react-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
      - name: react-app
        image: <your-account-id>.dkr.ecr.<your-region>.amazonaws.com/sunnyside-react-app:latest
        ports:
        - containerPort: 80

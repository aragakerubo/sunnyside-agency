apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunnyside-react-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sunnyside-react-app
  template:
    metadata:
      labels:
        app: sunnyside-react-app
    spec:
      containers:
      - name: sunnyside-react-container
        image: <account-id>.dkr.ecr.<region>.amazonaws.com/sunnyside-react-app:latest
        ports:
        - containerPort: 80
